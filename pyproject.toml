[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belote-cli"
version = "4.9.6"
description = "A 4-player terminal card game"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    { name = "elysium", email = "discelysioum@delicious.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "mypy"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = true

[project.urls]
Homepage = "https://github.com/ElysiumDisc/belote"
Repository = "https://github.com/ElysiumDisc/belote"
Issues = "https://github.com/ElysiumDisc/belote/issues"

[project.scripts]
belote = "belote.main:main"
belatro = "belote.belatro.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belote"]
