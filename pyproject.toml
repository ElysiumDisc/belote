[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "belote-cli"
version = "4.11.0"
description = "A 4-player terminal card game"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
    { name = "elysium", email = "discelysioum@delicious.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Environment :: Console",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest", "pytest-cov"]
dev = ["ruff", "mypy"]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "N", "UP", "B", "A", "C4", "RET", "SIM", "PTH",
    "RUF", "ARG001", "ARG004", "C901",
]
ignore = [
    "E501",
    # French text and card glyphs (é, ’, ♥) are intentional, not ambiguous.
    "RUF001", "RUF002", "RUF003",
    # Tuple concatenation on immutable state is the house style (and hot path).
    "RUF005",
]

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.per-file-ignores]
# Fixtures, fakes and monkeypatched callables routinely ignore arguments.
"tests/**" = ["ARG"]

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = false  # no third-party deps: a missing import is a real bug
check_untyped_defs = true
disallow_untyped_defs = true

[project.urls]
Homepage = "https://github.com/ElysiumDisc/belote"
Repository = "https://github.com/ElysiumDisc/belote"
Issues = "https://github.com/ElysiumDisc/belote/issues"

[project.scripts]
belote = "belote.main:main"
belatro = "belote.belatro.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/belote"]
